<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Vista 3D Tide City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Full-bleed WebGL flight over a sea city; slim flight-instrument HUD pinned to corners. Single bright midday look by design. */
:root{
  --ink:#ffffff; --dim:rgba(235,246,255,.78); --glass:rgba(8,28,48,.34); --line:rgba(200,235,255,.4); --accent:#7fe3ff;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:#9fc3e0;color:var(--ink)}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--mono)}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;cursor:grab}
#app canvas:active{cursor:grabbing}
.hud{position:fixed;pointer-events:none;z-index:2;text-shadow:0 1px 4px rgba(0,20,40,.55),0 0 12px rgba(0,20,40,.35)}
.brand{top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 16px);display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.18em}
.brand span{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.compass{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:min(240px,40vw);height:34px;overflow:hidden;
  background:var(--glass);border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);text-shadow:none}
.strip{position:absolute;top:0;left:0;height:100%;will-change:transform}
.strip span{position:absolute;top:0;transform:translateX(-50%)}
.strip .tick{top:4px;width:1px;height:6px;background:var(--dim)}
.strip .card{top:12px;font-family:var(--display);font-weight:700;font-size:14px}
.strip .card.n{color:var(--accent)}
.strip .ord{top:14px;font-size:10px;color:var(--dim)}
.needle{position:absolute;left:50%;top:0;width:2px;height:7px;margin-left:-1px;background:var(--accent)}
.deg{top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.1em;color:var(--dim);font-variant-numeric:tabular-nums}
.readout{left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:2px}
.alt{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.alt small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dim);margin-left:4px}
.layer{font-size:11px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.sub{font-size:11px;color:var(--dim)}
.vbtns{position:fixed;z-index:3;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:10px}
.vbtns button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:700 12px var(--display);letter-spacing:.08em;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none;cursor:pointer}
.vbtns button.on{background:rgba(127,227,255,.35);border-color:var(--accent)}
.vbtns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);
  padding:8px 12px;background:var(--glass);border:1px solid var(--line);border-radius:3px;font-size:11px;letter-spacing:.04em;text-align:center;transition:opacity .8s;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hint.gone{opacity:0}
.joy{position:fixed;z-index:3;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:1px solid var(--line);background:rgba(8,28,48,.2);pointer-events:none}
.joy .knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(127,227,255,.35);border:1px solid rgba(220,250,255,.7)}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:13px;color:#08243a}
.banner{top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);padding:6px 12px;
  font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;background:var(--glass);border:1px solid var(--line);border-radius:3px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .4s,border-color .4s;text-align:center}
.banner.alert{background:rgba(120,16,40,.55);border-color:rgba(255,110,150,.7)}
.banner.shield{background:rgba(10,80,120,.5);border-color:var(--accent)}
.banner.guns{background:rgba(120,70,10,.55);border-color:rgba(255,190,110,.75)}
.attack{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 16px);height:34px;padding:0 12px;
  border-radius:3px;border:1px solid rgba(255,140,170,.7);background:rgba(120,16,40,.5);color:#fff;font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.attack:hover{background:rgba(160,24,56,.65)}
.attack:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.views{position:fixed;z-index:3;right:calc(env(safe-area-inset-right,0px) + 16px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.views button{min-width:96px;height:34px;padding:0 10px;border-radius:3px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:700 11px var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.views button:hover{background:rgba(127,227,255,.28)}
.views button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.views button{min-width:78px;font-size:10px;letter-spacing:.04em}}
@media (max-width:420px){.attack{padding:0 8px;font-size:10px;letter-spacing:.06em}}
@media (max-width:420px){.brand span{display:none}.alt{font-size:18px}}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>


<div id="app"></div>
<div class="hud brand"><b>VISTA 3D</b><span>build 02 · tide city</span></div>
<div class="hud compass"><div class="strip" id="strip"></div><i class="needle"></i></div>
<div class="hud deg" id="deg">000° N</div>
<div class="hud banner" id="banner">Fleet holding</div>
<button class="attack" id="attack" type="button">Call fleet</button>
<div class="views" id="views">
  <button type="button" data-view="street">Street</button>
  <button type="button" data-view="dome">Inside dome</button>
  <button type="button" data-view="yard">Shipyard</button>
  <button type="button" data-view="overview">Overview</button>
  <button type="button" data-view="start">Start</button>
</div>
<div class="hud readout">
  <div class="layer" id="layer">Sea level</div>
  <div class="alt" id="alt">40<small>m</small></div>
  <div class="sub" id="sub">&nbsp;</div>
</div>
<div class="vbtns" id="vbtns">
  <button id="up" type="button" aria-label="Climb">UP</button>
  <button id="down" type="button" aria-label="Descend">DOWN</button>
</div>
<div class="hud hint" id="hint"></div>
<div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="err">The 3D engine failed to load. Reload the page to try again.</div>');return;}
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
catch(e){document.body.insertAdjacentHTML('beforeend','<div class="err">This browser could not start WebGL, which the scene needs to render.</div>');return;}

/* ---------- helpers ---------- */
let seed=2077;
const rng=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+rng()*(b-a),pick=a=>a[(rng()*a.length)|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const coarse=matchMedia('(pointer:coarse)').matches;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function ridged(x,y){let s=0,a=.55,f=1,w=1;for(let i=0;i<6;i++){let n=1-Math.abs(vnoise(x*f,y*f)*2-1);n*=n;s+=n*a*w;w=clamp(n*1.4,0,1);a*=.5;f*=2.03;}return s;}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=vnoise(x*f+31,y*f-17)*a;a*=.5;f*=2.1;}return s;}

/* ---------- renderer / scene ---------- */
renderer.setPixelRatio(Math.min(devicePixelRatio||1,coarse?1.6:2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
$('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
const FOG=C(0xb7cfe2),FOG_DEN=0.00007;
scene.fog=new THREE.FogExp2(FOG,FOG_DEN);
scene.background=FOG;
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,1,45000);
camera.rotation.order='YXZ';

const sunDir=new THREE.Vector3(-0.35,0.84,0.42).normalize();
const ZENITH=C(0x2f74c0);

/* ---------- sky ---------- */
const sky=new THREE.Mesh(new THREE.SphereGeometry(40000,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{sunDir:{value:sunDir},hor:{value:FOG},zen:{value:ZENITH}},
  vertexShader:'varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:`varying vec3 vDir;uniform vec3 sunDir,hor,zen;
  void main(){vec3 d=normalize(vDir);float y=max(d.y,0.0);
    vec3 c=mix(hor,zen,pow(smoothstep(0.0,1.0,y),0.55));
    float s=max(dot(d,sunDir),0.0);
    c+=vec3(1.0,0.95,0.85)*pow(s,12.0)*0.25+vec3(1.0,0.97,0.9)*pow(s,200.0)*1.2+vec3(3.0)*smoothstep(0.9993,0.9997,s);
    if(d.y<0.0)c=hor;
    gl_FragColor=vec4(c,1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`
}));
sky.renderOrder=-2;scene.add(sky);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(C(0xcfe6ff),C(0x3a6a8c),1.05));
const sun=new THREE.DirectionalLight(C(0xfff4e2),2.7);
sun.position.copy(sunDir).multiplyScalar(1000);scene.add(sun);

/* ---------- ocean ---------- */
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(90000,90000,1,1),new THREE.ShaderMaterial({
  fog:false,
  uniforms:{time:{value:0},sunDir:{value:sunDir},fogCol:{value:FOG},fogDen:{value:FOG_DEN},deep:{value:C(0x0b3550)},zen:{value:ZENITH}},
  vertexShader:'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:`varying vec3 vW;uniform float time,fogDen;uniform vec3 sunDir,fogCol,deep,zen;
  vec2 wv(vec2 p,vec2 d,float k,float a,float s){float ph=k*dot(normalize(d),p)+s*time;return normalize(d)*a*k*cos(ph);}
  void main(){
    vec2 p=vW.xz;float dist=length(cameraPosition-vW);
    float lod=1.0/(1.0+dist*0.0025);
    vec2 g=wv(p,vec2(1.0,0.35),0.018,1.1,0.9)+wv(p,vec2(-0.6,1.0),0.027,0.7,1.1)+wv(p,vec2(0.2,-1.0),0.041,0.45,1.4);
    g+=(wv(p,vec2(0.9,0.8),0.11,0.12,2.1)+wv(p,vec2(-1.0,0.2),0.17,0.08,2.6)+wv(p,vec2(0.3,1.0),0.29,0.05,3.3)+wv(p,vec2(-0.4,-0.9),0.53,0.025,4.1))*lod;
    vec3 N=normalize(vec3(-g.x,1.0,-g.y));
    vec3 V=normalize(cameraPosition-vW);
    float fres=0.02+0.98*pow(1.0-max(dot(N,V),0.0),5.0);
    vec3 Rf=reflect(-V,N);Rf.y=abs(Rf.y);
    vec3 skyc=mix(fogCol,zen,pow(clamp(Rf.y,0.0,1.0),0.55));
    vec3 col=mix(deep,skyc,fres);
    float sp=max(dot(Rf,sunDir),0.0);
    col+=vec3(1.0,0.96,0.88)*(pow(sp,600.0)*14.0+pow(sp,60.0)*0.35);
    float f=1.0-exp(-pow(fogDen*dist,2.0));
    col=mix(col,fogCol,f);
    gl_FragColor=vec4(col,1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`
}));
ocean.rotation.x=-Math.PI/2;ocean.renderOrder=-1;scene.add(ocean);


/* ---------- city ---------- */
function bandedMaterial(){
  const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.55,metalness:.15});
  m.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;')
      .replace('#include <project_vertex>','#include <project_vertex>\nvec4 wpp=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nwpp=instanceMatrix*wpp;\n#endif\nvWP=(modelMatrix*wpp).xyz;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;')
      .replace('#include <color_fragment>',`#include <color_fragment>
        float fl=fract(vWP.y/4.4);
        float glass=smoothstep(.06,.1,fl)*(1.0-smoothstep(.66,.7,fl));
        float fade=smoothstep(500.0,2800.0,length(vWP-cameraPosition));
        glass=mix(glass,.6,fade);
        diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(.16,.34,.48)+vec3(.02,.05,.08),glass*.9);`)
      .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\nroughnessFactor=mix(roughnessFactor,.12,glass);');
  };
  return m;
}
const towerMat=bandedMaterial();
const metalMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35,metalness:.35});
const baseMat=new THREE.MeshStandardMaterial({color:C(0x7c8792),roughness:.85,metalness:.1});
const accentMat=new THREE.MeshStandardMaterial({color:C(0xdff7ff),emissive:C(0x39c6ff),emissiveIntensity:.9,roughness:.3});

const CS=1.35;
const PLATS=[{x:0,z:0,r:340*CS,tier:0}];
for(let i=0;i<6;i++){const a=i/6*Math.PI*2+.3;PLATS.push({x:Math.cos(a)*650*CS,z:Math.sin(a)*650*CS,r:R(170,240)*CS,tier:1});}
for(let k=1;k<7;k++){const a=Math.PI*1.5+k/7*Math.PI*2;const d=R(1050,1250)*CS;PLATS.push({x:Math.cos(a)*d,z:Math.sin(a)*d,r:R(130,200)*CS,tier:2});}

const towers=[],tw={box:[],cyl:[],hex:[]},spires=[],decks=[],bridges=[],plats=[];
const tints=[0xffffff,0xeef3f7,0xe2ebf2,0xd7e6ee,0xf3efe6,0xcfe0e8].map(C);
const _q=new THREE.Quaternion(),_e=new THREE.Euler(),_p=new THREE.Vector3(),_s=new THREE.Vector3();
function mat4(x,y,z,sx,sy,sz,rx=0,ry=0,rz=0){_e.set(rx,ry,rz);_q.setFromEuler(_e);_p.set(x,y,z);_s.set(sx,sy,sz);return new THREE.Matrix4().compose(_p,_q,_s);}

for(const P of PLATS){
  plats.push(mat4(P.x,0,P.z,P.r,6,P.r,0,R(0,1),0));
  const hMax=(P.tier===0?880:P.tier===1?460:260)*1.3,hMin=(P.tier===0?120:P.tier===1?70:45)*1.3;
  const placed=[];
  for(let t=0;t<(P.tier===0?950:520);t++){
    const a=rng()*Math.PI*2,d=Math.sqrt(rng())*(P.r-30),x=P.x+Math.cos(a)*d,z=P.z+Math.sin(a)*d;
    const fp=R(16,P.tier===0?60:46);
    if(placed.some(o=>Math.hypot(o.x-x,o.z-z)<o.fp/2+fp/2+10))continue;
    const centr=1-d/P.r,h=hMin+Math.pow(rng(),1.7)*(hMax-hMin)*(.45+.55*centr);
    const T={x,z,fp,h,kind:pick(['box','box','cyl','hex']),tint:pick(tints),rot:rng()*Math.PI};
    placed.push(T);towers.push(T);
  }
}
for(const T of towers){
  const h1=T.h*R(.55,.8),h2=T.h*R(.82,.95),{x,z,fp,kind,rot}=T;
  const kindArr=tw[kind];
  kindArr.push({m:mat4(x,3,z,fp,h1,fp,0,rot,0),c:T.tint});
  kindArr.push({m:mat4(x,3+h1,z,fp*.76,h2-h1,fp*.76,0,rot,0),c:T.tint});
  kindArr.push({m:mat4(x,3+h2,z,fp*.5,T.h-h2,fp*.5,0,rot,0),c:T.tint});
  if(rng()<.5){T.spire=true;spires.push(mat4(x,3+T.h,z,fp*.1,T.h*R(.1,.28),fp*.1,0,rot,0));}
  const nd=rng()<.45?(rng()<.4?2:1):0;
  for(let i=0;i<nd;i++){const dh=T.h*R(.25,.85);decks.push(mat4(x,3+dh,z,fp*R(.75,1.05),R(2,4),fp*R(.75,1.05),0,0,0));}
}
// skybridges between nearby towers: the in-between layers
for(let i=0;i<towers.length;i++){const A=towers[i];if(rng()>.32)continue;
  let best=null,bd=1e9;for(const B of towers){if(B===A)continue;const d=Math.hypot(A.x-B.x,A.z-B.z);if(d<bd&&d<110){bd=d;best=B;}}
  if(!best)continue;
  const nb=rng()<.35?2:1;
  for(let k=0;k<nb;k++){const y=Math.min(A.h,best.h)*R(.2,.75),mx=(A.x+best.x)/2,mz=(A.z+best.z)/2,ang=Math.atan2(best.x-A.x,best.z-A.z);
    bridges.push(mat4(mx,y,mz,R(4,7),R(3,5),bd,0,ang,0));}
}
// long sea causeways between platforms
const causeways=[];
for(let i=1;i<PLATS.length;i++){const P=PLATS[i];const Q=P.tier===1?PLATS[0]:PLATS.filter(p=>p.tier===1).sort((a,b)=>Math.hypot(a.x-P.x,a.z-P.z)-Math.hypot(b.x-P.x,b.z-P.z))[0];
  const d=Math.hypot(P.x-Q.x,P.z-Q.z),ang=Math.atan2(P.x-Q.x,P.z-Q.z);
  causeways.push(mat4((P.x+Q.x)/2,R(18,40),(P.z+Q.z)/2,R(16,26),5,d,0,ang,0));}

function instanced(geo,material,list,cast){
  const mesh=new THREE.InstancedMesh(geo,material,list.length);
  list.forEach((it,i)=>{if(it.m){mesh.setMatrixAt(i,it.m);mesh.setColorAt(i,it.c);}else mesh.setMatrixAt(i,it);});
  scene.add(mesh);return mesh;
}
const unitBox=new THREE.BoxGeometry(1,1,1).translate(0,.5,0);
instanced(unitBox,towerMat,tw.box);
instanced(new THREE.CylinderGeometry(.5,.5,1,10).translate(0,.5,0),towerMat,tw.cyl);
instanced(new THREE.CylinderGeometry(.5,.5,1,6).translate(0,.5,0),towerMat,tw.hex);
instanced(new THREE.ConeGeometry(.5,1,6).translate(0,.5,0),metalMat,spires);
instanced(new THREE.CylinderGeometry(.5,.5,1,28),metalMat,decks);
instanced(new THREE.BoxGeometry(1,1,1),metalMat,bridges.concat(causeways));
instanced(new THREE.CylinderGeometry(1,1.04,1,6),baseMat,plats);
// accent light strip under every deck
instanced(new THREE.CylinderGeometry(.5,.5,1,28),accentMat,decks.map(m=>m.clone().multiply(new THREE.Matrix4().makeTranslation(0,-.6,0)).multiply(new THREE.Matrix4().makeScale(1.03,.25,1.03))));

// transit rings circling the city at several altitudes
const RINGS=[{r:520*CS,y:170},{r:900*CS,y:310},{r:1400*CS,y:110},{r:380*CS,y:520}];
for(const Rg of RINGS){

class Merger{
  constructor(){this.p=[];this.n=[];this.u=[];this.c=[];}
  add(g,m,col){const ng=g.index?g.toNonIndexed():g.clone();ng.applyMatrix4(m);
    const P=ng.attributes.position.array,Nn=ng.attributes.normal.array,U=ng.attributes.uv.array;
    for(let i=0;i<P.length;i++){this.p.push(P[i]);this.n.push(Nn[i]);}for(let i=0;i<U.length;i++)this.u.push(U[i]);
    for(let i=0;i<P.length/3;i++)this.c.push(col.r,col.g,col.b);}
  build(){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));g.computeBoundingSphere();return g;}
}

    }else{

    g.foam.scale.setScalar(breaking?1+(1-Math.abs(g.root.position.y+130)/130)*.8:g.foam.scale.x+dt*.3);

    if(g.broken){g.burn-=dt;if(g.burn<=0&&g.root.position.y>-250){g.burn=.1;const p=g.yawG.localToWorld(new THREE.Vector3(R(-150,150),R(60,230),R(-200,220)));

      }
      if(c.m.position.y<0){c.state='done';c.m.visible=false;const p=c.m.position.clone().setY(5);
        emitSprayAt(p.x,p.z,140,240,1.3);boom(p,1200,0xffffff,1.8);boom(p,700,0xff8a2a,.8);for(let i=0;i<5;i++)puff(p,R(200,320),6);
        spawnDebris(p,14,12,60,140,4);}
    }
  }
}
function resetCivs(){civs.forEach(c=>{c.state='idle';c.m.visible=false;});}
function shootStraggler(){
  const c=civs[0];if(c.state!=='fly')return;
  const shooter=liveShips().slice().sort((a,b)=>a.grp.position.distanceToSquared(c.m.position)-b.grp.position.distanceToSquared(c.m.position))[0];
  if(!shooter)return;
  const from=shipLocalPoint(shooter,true),to=c.m.position.clone().addScaledVector(c.dir,120*from.distanceTo(c.m.position)/2600);
  boom(from,180,0xff4d88,.35);
  fire(from,to,2600,'enemy',p=>{
    if(c.state!=='fly')return;
    c.state='fall';c.m.position.copy(p);c.glowS.visible=false;
    c.vel.copy(c.dir).setY(0).normalize().multiplyScalar(290).setY(25);c.spin=R(.8,1.4)*(rng()<.5?-1:1);c.fx=0;
    boom(p,900,0xfff2d0,.5);boom(p,1400,0xff6a1a,1.4);
  });
}

/* ---------- early strike: the fleet fires before the shield is up ---------- */
const burners=[];
const coreTowers=towers.filter(T=>Math.hypot(T.x,T.z)<PLATS[0].r-15&&T.h>260).sort((a,b)=>b.h-a.h);
function earlyShot(n){
  const shooter=capitals[0];if(shooter.crash)return;
  const from=shipLocalPoint(shooter,true);let to,onHit;
  if(n<2&&coreTowers[n*2]){const T=coreTowers[n*2];to=new THREE.Vector3(T.x+R(-T.fp*.3,T.fp*.3),3+T.h*R(.62,.9),T.z+R(-T.fp*.3,T.fp*.3));
    onHit=p=>{boom(p,700,0xfff2d0,.5);boom(p,1300,0xff6a1a,1.8);for(let i=0;i<5;i++)puff(p,R(120,220),5);burners.push({p:p.clone(),t:0});};}
  else{const a=rng()*6.283,r=R(PLATS[0].r+20,PLATS[0].r+220);to=new THREE.Vector3(Math.cos(a)*r,2,Math.sin(a)*r);
    onHit=p=>{boom(p,500,0xffffff,1.2);boom(p,600,0xff8a2a,.7);emitSprayAt(p.x,p.z,50,90,1);};}
  boom(from,200,0xff4d88,.35);
  fire(from,to,2400,'enemy',onHit);
}
function updateBurners(dt){
  for(const b of burners){b.t+=dt;const s=b.s||1;
    if(rng()<dt*9)puff(b.p.clone().add(_cv.set(R(-15,15)*s,R(0,20)*s,R(-15,15)*s)),R(110,200)*s,R(5,8)*(s>1?1.5:1));
    if(rng()<dt*5)boom(b.p.clone().add(_cv.set(R(-12,12)*s,R(-8,8)*s,R(-12,12)*s)),R(50,110)*s,pick([0xff7a1a,0xff4a10,0xffb040]),R(.4,.8));}
}

/* ---------- street level: a free spot on the core's north edge, and walkable ground ---------- */
function groundAt(x,z){
  if(Math.hypot(x-PORT.x,z-PORT.z)<PORT.r*.97)return PORT.top;
  for(const P of PLATS)if(Math.hypot(x-P.x,z-P.z)<P.r*.95)return 3;
  return null;
}
function blockedAt(x,z){for(const T of towers){const r=T.fp*(T.kind==='box'?.68:.52)+1.2,dx=x-T.x,dz=z-T.z;if(dx*dx+dz*dz<r*r)return true;}return false;}
const streetSpot=(()=>{let best=null,bs=-1;for(let k=0;k<400;k++){const a=-Math.PI/2+R(-.7,.7),r=R(PLATS[0].r*.55,PLATS[0].r*.9),x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(groundAt(x,z)===null)continue;let m=1e9;for(const T of towers){const d=Math.hypot(x-T.x,z-T.z)-T.fp*.7;if(d<m)m=d;}if(m>bs){bs=m;best={x,z};}}return best||{x:0,z:-PLATS[0].r*.8};})();
let walkMode=false;
/* ---------- player flight ---------- */
const player=new THREE.Vector3(0,40,3700);
let yaw=0,pitch=.07,glide=0,vert=0,walkBob=0;
const vel=new THREE.Vector3(),keys={},joy={x:0,y:0,bx:0,by:0};

addEventListener('keydown',e=>{keys[e.code]=true;if(/^(Arrow|Space)/.test(e.code))e.preventDefault();dismissHint();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;vert=0;});

const cv=renderer.domElement,ptrs=new Map(),joyEl=$('joy'),knob=$('knob');
let joyId=null,lookId=null;
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  dismissHint();
  if(e.pointerType==='touch'&&joyId===null&&e.clientX<innerWidth*.45){
    joyId=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';knob.style.transform='';joyEl.hidden=false;
  }else if(lookId===null)lookId=e.pointerId;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(e.pointerId===joyId){let jx=e.clientX-joy.bx,jy=e.clientY-joy.by;const L=Math.hypot(jx,jy),mx=52;if(L>mx){jx*=mx/L;jy*=mx/L;}
    joy.x=jx/mx;joy.y=-jy/mx;knob.style.transform=`translate(${jx}px,${jy}px)`;}
  else if(e.pointerId===lookId){const k=e.pointerType==='touch'?.0055:.0033;yaw-=dx*k;pitch=clamp(pitch-dy*k,-1.45,1.45);}
});
const endPtr=e=>{if(e.pointerId===joyId){joyId=null;joy.x=joy.y=0;joyEl.hidden=true;}if(e.pointerId===lookId)lookId=null;ptrs.delete(e.pointerId);};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();dismissHint();glide=clamp(glide-e.deltaY*.25,-400,400);},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function holdBtn(el,dir){
  const on=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}vert=dir;el.classList.add('on');dismissHint();};
  const off=()=>{if(vert===dir)vert=0;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
holdBtn($('up'),1);holdBtn($('down'),-1);

function step(dt){
  let f=0,s=0,u=vert;
  if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyD)s+=1;if(keys.KeyA)s-=1;
  if(keys.ArrowLeft)yaw+=1.6*dt;if(keys.ArrowRight)yaw-=1.6*dt;
  if(keys.Space||keys.KeyE)u+=1;if(keys.KeyQ||keys.KeyC||keys.ControlLeft)u-=1;
  f+=joy.y;s+=joy.x;
  const L=Math.hypot(f,s);if(L>1){f/=L;s/=L;}
  const boost=keys.ShiftLeft||keys.ShiftRight||Math.hypot(joy.x,joy.y)>.96;
  if(walkMode){
    if(u!==0||keys.Space){walkMode=false;}
    else{
      const sp=boost?14:5.5,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
      const a=1-Math.exp(-8*dt);vel.x+=((fx*f+rx*s)*sp-vel.x)*a;vel.z+=((fz*f+rz*s)*sp-vel.z)*a;vel.y=0;
      const nx=player.x+vel.x*dt,nz=player.z+vel.z*dt;
      if(groundAt(nx,player.z)!==null&&!blockedAt(nx,player.z))player.x=nx;else vel.x=0;
      if(groundAt(player.x,nz)!==null&&!blockedAt(player.x,nz))player.z=nz;else vel.z=0;
      const gy=groundAt(player.x,player.z);player.y+=((gy===null?3:gy)+1.7-player.y)*(1-Math.exp(-10*dt));
      walkBob+=Math.hypot(vel.x,vel.z)*dt*1.6;
      camera.position.set(player.x,player.y+(reduceMotion?0:Math.sin(walkBob*2)*.04),player.z);
      camera.rotation.set(pitch,yaw,0);return;
    }
  }
  const altK=1+clamp(player.y/600,0,3);
  const sp=(boost?460:95)*altK,vs=(boost?340:75)*Math.min(altK,2.2);
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const tx=(fx*f+rx*s)*sp+fx*glide,tz=(fz*f+rz*s)*sp+fz*glide,ty=clamp(u,-1,1)*vs;
  const a=1-Math.exp(-4*dt);vel.x+=(tx-vel.x)*a;vel.z+=(tz-vel.z)*a;vel.y+=(ty-vel.y)*a;
  glide*=Math.exp(-1.6*dt);if(Math.abs(glide)<.5)glide=0;
  player.addScaledVector(vel,dt);
  player.y=clamp(player.y,4,5200);
  const rad=Math.hypot(player.x,player.z),MAXR=12000;if(rad>MAXR){player.x*=MAXR/rad;player.z*=MAXR/rad;}
  const sway=reduceMotion?0:Math.sin(performance.now()*.0009)*.35;
  camera.position.set(player.x,player.y+sway,player.z);
  camera.rotation.set(pitch,yaw,clamp(-(vel.x*rx+vel.z*rz)*.0009,-.12,.12));
}

/* ---------- HUD ---------- */
const strip=$('strip'),PX=2;let compassW=200;
(function(){let h='';const names={0:'N',45:'NE',90:'E',135:'SE',180:'S',225:'SW',270:'W',315:'NW'};
  for(let d=-360;d<=720;d+=15){const nd=((d%360)+360)%360,lb=names[nd];
    h+=lb?`<span class="${lb.length===1?'card'+(lb==='N'?' n':''):'ord'}" style="left:${(d+360)*PX}px">${lb}</span>`:`<span class="tick" style="left:${(d+360)*PX}px"></span>`;}
  strip.innerHTML=h;})();
const DIRS=['N','NE','E','SE','S','SW','W','NW'];
let hudT=0;
function layerName(y){if(walkMode)return'Street level · on foot';if(y<25)return'Sea level';let best=LAYERS[0];for(const L of LAYERS)if(Math.abs(L.y-y)<Math.abs(best.y-y))best=L;
  if(Math.abs(best.y-y)<35)return best.name+' · '+best.y+' m';if(y>1100)return y>2000?'Among the capital ships':'Open sky';return'Between layers';}
function hud(dt){
  const heading=((-yaw*180/Math.PI)%360+360)%360;
  strip.style.transform=`translateX(${compassW/2-(heading+360)*PX}px)`;
  hudT+=dt;if(hudT<.12)return;hudT=0;
  $('deg').textContent=String(Math.round(heading)%360).padStart(3,'0')+'° '+DIRS[Math.round(heading/45)%8];
  $('alt').innerHTML=Math.round(player.y).toLocaleString()+'<small>m · '+Math.round(Math.hypot(vel.x,vel.y,vel.z)*3.6)+' km/h</small>';
  $('layer').textContent=layerName(player.y);
  const d=Math.hypot(player.x,player.z),b=((Math.atan2(-player.x,player.z)*180/Math.PI)+360)%360;
  $('sub').textContent=d<400?'Over the city core':'City core '+(d/1000).toFixed(1)+' km '+DIRS[Math.round(b/45)%8];
}
const bannerEl=$('banner'),attackBtn=$('attack');let bannerKey='';
function fleetKm(){let m=1e9;for(const c of liveShips())m=Math.min(m,Math.hypot(c.grp.position.x,c.grp.position.z));return(m/1000).toFixed(1);}
function updateBanner(id,pt){
  let txt,cls='';
  const A=capitals[CRASH_A],B=capitals[CRASH_B];
  if(id==='calm')txt=battles?'Fleet driven off · wreckage burning':'All quiet over Tide City';
  else if(id==='escape'){cls='alert';txt=pt<PEEL_T?'City flagship inbound · under fire':pt<FLY_T?'Raiders break off · flagship crossing the city':'Flagship landing at the shipyard';}
  else if(id==='approach'){cls='alert';txt=pt>=19.4?'Fleet opened fire · city hit':'Enemy fleet inbound · '+fleetKm()+' km';}
  else if(id==='bombard'){cls=pt<2.4?'alert':'shield';txt=civs[0].state==='fall'?'Straggler shot down outside the shield':pt<2.4?'Incoming fire · shield raising':pt<3.4?'Shield holding':pt<9.5?'Shield holding · sea guns surfacing':'Shield holding · guns locked on';}
  else if(id==='counter'){cls='guns';txt=pt<1.4?'Shield down · guns firing':(A.crash&&!A.crash.impact)?'Enemy ship going down':(A.crash&&A.crash.impact&&A.crash.t<5)?'Wreck hit a sea gun':'Sea guns firing';}
  else{const bd=B.crash&&(!B.crash.impact||B.crash.t<4);txt=bd?'Second ship going down':'Fleet withdrawing · '+fleetKm()+' km';cls=bd?'guns':'';}
  const key=txt+cls;if(key!==bannerKey){bannerKey=key;bannerEl.textContent=txt;bannerEl.className='hud banner '+cls;}
  attackBtn.hidden=id!=='calm';
}
const VIEWS={dome:{p:[200,330,-680],look:[-200,1100,-4800]},overview:{p:[0,2600,10500],look:[0,900,-2500]},start:{p:[0,40,3700],look:[0,260,0]},
  yard:{p:[2700,520,4700],look:[0,500,7600]},street:{p:[streetSpot.x,4.7,streetSpot.z],look:[streetSpot.x*.2,420,streetSpot.z-1600]}};
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>{const V=VIEWS[b.dataset.view];
  walkMode=b.dataset.view==='street';player.set(...V.p);vel.set(0,0,0);glide=0;const dx=V.look[0]-V.p[0],dy=V.look[1]-V.p[1],dz=V.look[2]-V.p[2];
  yaw=Math.atan2(-dx,-dz);pitch=Math.atan2(dy,Math.hypot(dx,dz));dismissHint();b.blur();}));
attackBtn.addEventListener('click',()=>{callFleet();attackBtn.blur();});
const hint=$('hint');
hint.textContent=coarse?'Left thumb flies · right thumb looks · UP / DOWN for altitude · tap Call fleet to start':'Drag to look · WASD to fly · Space up · Q down · Shift to boost · press Call fleet to start the attack';
let hintGone=false;function dismissHint(){if(hintGone)return;hintGone=true;setTimeout(()=>hint.classList.add('gone'),2500);}
setTimeout(dismissHint,7000);
if(!coarse)$('vbtns').style.display='none';

/* ---------- loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();compassW=strip.parentElement.clientWidth;}
addEventListener('resize',resize);resize();

let last=performance.now(),t=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  step(dt);
  sky.position.copy(camera.position);
  ocean.position.set(camera.position.x,0,camera.position.z);
  ocean.material.uniforms.time.value=t;
  director(dt,t);
  updateBolts(dt);updateBooms(dt);updateSpray(dt);updateSmoke(dt);updateMissiles(dt);updateTrails(dt);
  updateFlyers(t,dt);
  hud(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body>
