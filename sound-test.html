<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Elyra · Sound test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- The hidden sound test: every event in js/shared/sfx-map.js, plus the composite sounds built on them. Reached from the menu
     (Settings open, T three times, or three quick taps on SETTINGS) or directly at sound-test.html. Not linked anywhere else. -->
<style>
:root{--bg:#05070d;--panel:#0b1120;--line:rgba(140,200,255,.22);--ink:#e8eef8;--dim:rgba(220,232,255,.55);--gold:#e8c36a;--cy:#7fe3ff;--red:#ff6a5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 'Chakra Petch','Arial Narrow',system-ui,sans-serif;padding:16px;padding-bottom:60px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;justify-content:space-between;max-width:1100px;margin:0 auto 14px}
h1{margin:0;font-size:20px;letter-spacing:.32em}
h1 small{display:block;font-size:11px;letter-spacing:.2em;color:var(--dim);margin-top:4px}
a{color:var(--cy)}
.bar{max-width:1100px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px;border:1px solid var(--line);background:var(--panel)}
.bar label{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.bar input[type=range]{width:140px;accent-color:var(--gold)}
.bar output{font:400 12px 'JetBrains Mono',monospace;color:var(--ink);min-width:4.5em}
button{font:700 11px 'Chakra Petch','Arial Narrow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:rgba(20,34,60,.7);border:1px solid var(--line);padding:9px 12px;cursor:pointer;border-radius:2px}
button:hover{border-color:var(--cy)}button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button.on{border-color:var(--gold);color:var(--gold)}
.status{font:400 12px 'JetBrains Mono',monospace;color:var(--dim)}
main{max-width:1100px;margin:0 auto;display:grid;gap:14px}
section{border:1px solid var(--line);background:var(--panel);padding:12px}
section h2{margin:0 0 10px;font-size:11px;letter-spacing:.24em;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;text-transform:none;letter-spacing:.02em;font:500 13px 'Chakra Petch',sans-serif}
.ev i{font:400 10px 'JetBrains Mono',monospace;font-style:normal;color:var(--dim);white-space:nowrap}
.ev.ready i{color:var(--cy)}.ev.playing{border-color:var(--gold)}
@media (max-width:560px){body{padding:10px}.bar input[type=range]{width:110px}}
</style>
</head>
<body>
<header>
  <h1>SOUND TEST<small>every mapped event · js/shared/sfx-map.js</small></h1>
  <a href="index.html">← Menu</a>
</header>
<div class="bar">
  <button type="button" id="all">Play all</button>
  <label>Distance<input type="range" id="dist" min="0" max="100" value="0"><output id="distV">beside you</output></label>
  <label>Pan<input type="range" id="pan" min="-100" max="100" value="0"><output id="panV">centre</output></label>
  <button type="button" id="room">Indoors: off</button>
  <span class="status" id="st">Tap anywhere to start the sound · loading files…</span>
</div>
<main id="list"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* the shared audio needs a camera, clamp() and the fx calls it hooks; this page has no scene, so these stand in */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const camera=new THREE.PerspectiveCamera(60,1,.1,1e6);camera.position.set(0,0,0);camera.rotation.set(0,0,0);
function fire(){}function boom(){}function fireMissile(){}
</script>
<script src="js/shared/sfx-map.js?v=1800000000"></script>
<script src="js/shared/audio.js?v=1800000000"></script>
<script>
(()=>{
  const $=id=>document.getElementById(id),EV=SFX_MAP.ev,names=Object.keys(EV);
  sfx.load();   // no level to wait for: fetch now
  // where a positional sound is played: ahead of you at the distance slider (scaled units, as shot() uses: 1 m = 25 on the ground),
  // left or right by the pan slider
  const where=()=>{const d=+$('dist').value,p=+$('pan').value/100;if(!d&&!p)return null;const D=20+d*d*.6;
    return new THREE.Vector3(Math.sin(p*1.2)*D,0,-Math.cos(p*1.2)*D);};
  $('dist').oninput=()=>{const d=+$('dist').value,D=20+d*d*.6;$('distV').textContent=d?Math.round(D)+' u':'beside you';};
  $('pan').oninput=()=>{const p=+$('pan').value;$('panV').textContent=p?(p<0?'left ':'right ')+Math.abs(p)+'%':'centre';};
  let room=false;$('room').onclick=()=>{room=!room;sfx.indoor(room?1:0);$('room').textContent='Indoors: '+(room?'on':'off');$('room').classList.toggle('on',room);};

  /* what each button does: a plain event plays itself (own events at your position unless a distance is set); loops run for 3 s;
     the composite sounds (reload, flyby with doppler, launch, the big moments) run through their own calls */
  const loopsOn=new Map();
  function runLoop(n,sec){const until=performance.now()+sec*1000;loopsOn.set(n,until);
    const step=()=>{if(performance.now()>until){loopsOn.delete(n);return;}sfx.loopAt(n,'test',where(),1,1);requestAnimationFrame(step);};step();}
  function playEv(n){sfx.start();const S=EV[n];if(S.loop){runLoop(n,3);return 3;}
    const pos=where();sfx.play(n,pos,pos?{world:true}:null);return Math.min(3.5,(S.tail||2)+.2);}
  const EXTRA=[
    ['Reload (3 s)',()=>{sfx.reload(3);return 3.2;}],['Weapon swap',()=>{sfx.swap();return .8;}],['Empty click',()=>{sfx.empty();return .6;}],
    ['Low ammo',()=>{sfx.lowAmmo();return .7;}],['Hit confirm · Empty Host',()=>{sfx.hitConfirm(false);return .5;}],['Hit confirm · armoured',()=>{sfx.hitConfirm(true);return .5;}],
    ['Grenade throw',()=>{sfx.toss();return .6;}],['Flyby (doppler)',()=>{sfx.flyby(3);return 5;}],['Launch / lift-off',()=>{sfx.liftoff(null,5);return 7;}],
    ['Door · big',()=>{sfx.door(where(),'big',4);return 4.5;}],['Door · open',()=>{sfx.door(where(),'open');return 2;}],['Hatch',()=>{sfx.door(where(),'hatch');return 1;}],
    ['Herald charge-up',()=>{sfx.charge(where());return 1;}],['Keeper missile',()=>{sfx.missile(where(),false);return 3;}],['Hollow missile',()=>{sfx.missile(where(),true,'hollow');return 3;}],
    ['Big moment · dome',()=>{sfx.moment('dome');return 6;}],['Big moment · Hollow King',()=>{sfx.moment('king');return 4;}],
    ['Big explosion (synth)',()=>{sfx.explosion(where()||new THREE.Vector3(0,0,-200),3000);return 3;}],['Engine · interceptor',()=>{const u=performance.now()+3000;const s=()=>{if(performance.now()>u){sfx.engine(0,false,false);return;}sfx.engine(.7,false,true);requestAnimationFrame(s);};s();return 3.4;}],
  ];
  // group the events by what they are
  const GROUPS=[['Keepers · your guns',n=>/^gun\.(rifle|lance|side|breaker)/.test(n)],['Keepers · allies, vehicles, ships',n=>/^(gun\.(squad|keeper|walker|skiff|pilot|fighter|capital|flak|pf)|missile\.keeper)/.test(n)],
    ['The Heralds',n=>/herald/.test(n)&&!/^hit/.test(n)||n==='gun.heavy'],['The Hollow · Empty Host',n=>/hollow/.test(n)&&!/^hit/.test(n)],
    ['Engines, flybys, launches',n=>/^(loop|flyby|launch|engine)/.test(n)],['Doors, hatches, airlocks',n=>/^door/.test(n)],['Gear and feedback',n=>/^(reload|empty|swap|lowammo|hit|nade)/.test(n)]];
  const list=$('list'),btns=[];const used=new Set();
  const mk=(label,run,ev)=>{const b=document.createElement('button');b.type='button';b.className='ev';b.innerHTML=`<span>${label}</span><i></i>`;b.dataset.ev=ev||'';
    b.onclick=()=>{const d=run();b.classList.add('playing');setTimeout(()=>b.classList.remove('playing'),(d||1)*1000);};btns.push(b);return b;};
  for(const [title,test] of GROUPS){const sec=document.createElement('section');sec.innerHTML=`<h2>${title.toUpperCase()}</h2>`;const g=document.createElement('div');g.className='grid';
    for(const n of names)if(!used.has(n)&&test(n)){used.add(n);g.appendChild(mk(n,()=>playEv(n),n));}sec.appendChild(g);list.appendChild(sec);}
  const rest=names.filter(n=>!used.has(n));if(rest.length){const sec=document.createElement('section');sec.innerHTML='<h2>IMPACTS AND OTHER</h2>';const g=document.createElement('div');g.className='grid';rest.forEach(n=>g.appendChild(mk(n,()=>playEv(n),n)));sec.appendChild(g);list.appendChild(sec);}
  {const sec=document.createElement('section');sec.innerHTML='<h2>COMPOSITE SOUNDS</h2>';const g=document.createElement('div');g.className='grid';EXTRA.forEach(([l,f])=>g.appendChild(mk(l,f)));sec.appendChild(g);list.appendChild(sec);}
  // play every mapped event in turn
  let allOn=false;$('all').onclick=async()=>{if(allOn){allOn=false;return;}allOn=true;$('all').textContent='Stop';$('all').classList.add('on');sfx.start();
    for(const b of btns){if(!allOn)break;b.scrollIntoView({block:'nearest'});b.click();const S=EV[b.dataset.ev];await new Promise(r=>setTimeout(r,S?(S.loop?3300:Math.min(1600,((S.tail||1.2)+.3)*1000)):1800));}
    allOn=false;$('all').textContent='Play all';$('all').classList.remove('on');};
  // status: which files are in
  setInterval(()=>{const F=sfx.files;$('st').textContent=(sfx.on?'':'Muted (M) · ')+F.loaded+' / '+F.total+' files loaded'+(F.loaded<F.total?' · tap anywhere to start the sound':'');
    for(const b of btns){const n=b.dataset.ev;if(!n)continue;const r=sfx.ready(n);b.classList.toggle('ready',r);b.querySelector('i').textContent=r?(EV[n].loop?'loop':'file'):'…';}},400);
})();
</script>
</body>
</html>
